# M0 spike: Floci and MiniStack side by side. Throwaway; see plans/261027-1353-m0-spike-emulator-and-render-validation.
# Tags checked on Docker Hub 2026-10-27. Both digests are multi-arch index digests (amd64 + arm64).
services:
  floci:
    image: floci/floci:2.3.0@sha256:e0b292df4dc9559b7b1bf4f51bdda4bb8e269276236438cd03cae661260ea8a9
    container_name: m0-floci
    user: root # needed to drive the Docker socket for EC2 containers
    ports:
      - "4566:4566"
    environment:
      FLOCI_STORAGE_MODE: memory
      FLOCI_SERVICES_UI_ENABLED: "false"
      # Report the subnet-allocated private IP instead of the Docker bridge IP.
      FLOCI_SERVICES_EC2_AWS_FAITHFUL_PRIVATE_IP: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  ministack:
    image: ministackorg/ministack:1.5.33@sha256:b58186186515a372798ccf0ca9975c295db219b5a811975337d6967b968e07b4
    container_name: m0-ministack
    ports:
      - "4567:4566"
