[project]
name = "cloudy-labs"
version = "0.1.0"
description = "Cloudy Labs: hands-on labs for AWS on local emulators"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.120",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
    "websockets>=17.3",
]

[project.scripts]
labctl = "cloudy_labs.cli:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests marked `docker` drive the real emulator stack (`pytest -m docker`); `llm` ones also ask a real model
# (`pytest -m llm`).
addopts = "-m 'not docker and not llm'"
markers = [
    "docker: needs a running Docker daemon and starts the emulator stack",
    "llm: calls the LLM provider set by LLM_BASE_URL, LLM_API_KEY, LLM_MODEL and LLM_API_FORMAT",
]
