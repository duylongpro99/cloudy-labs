[project]
name = "cloudy-labs"
version = "0.1.0"
description = "Cloudy Labs: hands-on labs for AWS on local emulators"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.120",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
labctl = "cloudy_labs.cli:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests marked `docker` drive the real emulator stack; run them with `pytest -m docker`.
addopts = "-m 'not docker'"
markers = ["docker: needs a running Docker daemon and starts the emulator stack"]
