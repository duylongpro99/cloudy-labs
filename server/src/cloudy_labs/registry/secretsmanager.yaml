# AWS Secrets Manager secrets. ListSecrets answers metadata and rotation settings; secret values are
# never read (no GetSecretValue), so neither the scene nor the chat ever holds one.

- kind: secretsmanager-secret
  service: secretsmanager
  label: Secret
  list: {method: list_secrets, items: SecretList}
  id: ARN
  name: [Name]
  parent: [{kind: region}]
  # No prop name may contain "secret": the chat deny-list matches it as a substring.
  props:
    description: Description
    kmsKey: KmsKeyId
    rotationEnabled: RotationEnabled
    rotationLambda: RotationLambdaARN
    rotationDays: RotationRules.AutomaticallyAfterDays
    rotationSchedule: RotationRules.ScheduleExpression
    lastRotated: LastRotatedDate
    nextRotation: NextRotationDate
    lastChanged: LastChangedDate
    pendingRotation: "contains(values(not_null(SecretVersionsToStages, `{}`))[], 'AWSPENDING')"
    versions: "length(keys(not_null(SecretVersionsToStages, `{}`)))"
    primaryRegion: PrimaryRegion
    owningService: OwningService
    tags: {hook: common.tags}
  chat_props: [description, kmsKey, rotationEnabled, rotationLambda, rotationDays, rotationSchedule, lastRotated, nextRotation, lastChanged, pendingRotation, versions, primaryRegion, owningService, tags]
  edges:
    - {kind: encrypted-by, target: KmsKeyId, match: "[KeyId, KeyArn, AliasName, AliasArn]", to: [kms-key, kms-alias], style: reference}
    - {kind: rotated-by, target: RotationLambdaARN, to: lambda-function, style: reference}
  caveats:
    - {code: secret-rotation-not-verified, prop: pendingRotation, text: "Floci 2.3.0 invokes the rotation function and sets LastRotatedDate even when the function did nothing and the new version stays AWSPENDING; a later RotateSecret then fails until that version is finished. Check pendingRotation, not lastRotated."}
  builder: true
  view: {role: block, category: security, icon: Arch_AWS-Secrets-Manager_48.svg, source: Architecture-Service-Icons_07312026/Arch_Security-Identity/48/Arch_AWS-Secrets-Manager_48.svg, height: 0.3, order: 112, actions: [Secret]}
  contract:
    create: {op: create-secret, params: {Name: ct-secret, SecretString: ct-dummy}, save: secret}
    then:
      - {op: delete-secret, params: {SecretId: "{secret}", RecoveryWindowInDays: "7"}}
  ops:
    - id: create-secret
      api: CreateSecret
      gesture: create
      title: "Tạo secret"
      fields: [{name: Name, placeholder: my-app/db}, Description, SecretString, {name: KmsKeyId, ref: kms-key}]
      result_id: ARN
      expect: {label: Name}
      note: "Store a password, token or JSON document. The scene and the assistant never read the value back; only who may read it (IAM) and how it rotates are shown. Without KmsKeyId the account's aws/secretsmanager key encrypts it."
    - id: rotate-secret
      api: RotateSecret
      gesture: connect
      title: "Bật xoay vòng secret bằng Lambda"
      fields: [{name: SecretId, ref: secretsmanager-secret}, {name: RotationLambdaARN, ref: lambda-function}, RotationRules.AutomaticallyAfterDays, RotateImmediately]
      defaults: {RotationRules.AutomaticallyAfterDays: 30, RotateImmediately: false}
      source: secretsmanager-secret
      source_param: SecretId
      targets: [lambda-function]
      target_param: RotationLambdaARN
      note: "Let a Lambda function change the value on a schedule. Secrets Manager must be allowed to invoke the function (a resource-based policy for secretsmanager.amazonaws.com), and the function moves the new version from AWSPENDING to AWSCURRENT."
    - id: cancel-rotate-secret
      api: CancelRotateSecret
      gesture: attribute
      title: "Tắt xoay vòng secret"
      fields: [{name: SecretId, ref: secretsmanager-secret}]
      targets: [secretsmanager-secret]
      target_param: SecretId
      note: "Stop scheduled rotation. The rotation function stays configured; RotateSecret turns rotation on again."
    - id: delete-secret
      api: DeleteSecret
      gesture: delete
      title: "Xoá secret"
      fields: [{name: SecretId, ref: secretsmanager-secret}, RecoveryWindowInDays, ForceDeleteWithoutRecovery]
      defaults: {RecoveryWindowInDays: 7}
      targets: [secretsmanager-secret]
      target_param: SecretId
      note: "Schedule the secret for deletion after a 7 to 30 day recovery window; RestoreSecret brings it back until then. The secret disappears from the list at once. ForceDeleteWithoutRecovery deletes it now and cannot be combined with a window."
