- kind: db-proxy
  service: rds
  label: RDS Proxy
  list: {method: describe_db_proxies, items: DBProxies}
  enrich:
    - {method: describe_db_proxy_targets, params: {DBProxyName: DBProxyName}, pick: Targets, merge_as: _Targets}
    - hook: rds.arns
      args: {own: DBProxyArn, refs: {_TargetArns: [db, "_Targets[?Type=='RDS_INSTANCE'].RdsResourceId"]}}
  id: DBProxyArn
  name: [DBProxyName]
  parent: [{kind: vpc, path: VpcId}]
  props:
    engineFamily: EngineFamily
    status: Status
    endpoint: Endpoint
    requireTls: RequireTLS
    subnets: "VpcSubnetIds && sort(VpcSubnetIds)"
    targets: "sort_by(_Targets || `[]`, &RdsResourceId)[].{resource: RdsResourceId, type: Type, health: TargetHealth.State}"
  chat_props: [engineFamily, status, requireTls, subnets, targets]
  edges:
    - {kind: attached, target: VpcSecurityGroupIds, to: security-group, reverse: true, style: attach}
    - {kind: proxy-target, target: _TargetArns, to: db-instance, style: reference}
    - {kind: execution-role, target: RoleArn, to: iam-role, style: reference}
  builder: true
  view: {role: block, category: database, icon: Res_Amazon-RDS-Proxy-Instance_48.svg, source: Resource-Icons_07312026/Res_Databases/Res_Amazon-RDS-Proxy-Instance_48.svg, height: 0.5, order: 73, host: true, actions: [DBProxy]}
  contract:
    needs:
      - {op: create-vpc, params: {name: ct-proxy-vpc, cidr: 10.87.0.0/16}, save: vpc}
      - {op: create-subnet, params: {name: ct-proxy-a, vpcId: "{vpc}", cidr: 10.87.1.0/24, az: "{region}a"}, save: a}
      - {op: create-subnet, params: {name: ct-proxy-b, vpcId: "{vpc}", cidr: 10.87.2.0/24, az: "{region}b"}, save: b}
      - {op: create-role, params: {RoleName: ct-proxy-role, AssumeRolePolicyDocument: '{"Version": "2012-10-17", "Statement": [{"Effect": "Allow", "Principal": {"Service": "rds.amazonaws.com"}, "Action": "sts:AssumeRole"}]}'}, save: role}
    create: {op: create-db-proxy, params: {DBProxyName: ct-proxy, EngineFamily: POSTGRESQL, Auth: '[{"AuthScheme": "SECRETS", "SecretArn": "arn:aws:secretsmanager:{region}:000000000000:secret:ct-proxy"}]', RoleArn: "{role}", VpcSubnetIds: "{a},{b}"}, save: proxy}
    parent: vpc
  ops:
    - id: create-db-proxy
      api: CreateDBProxy
      gesture: create
      title: "Tạo RDS Proxy"
      fields: [DBProxyName, EngineFamily, {name: Auth, multiline: true}, RoleArn, VpcSubnetIds, VpcSecurityGroupIds, RequireTLS]
      choices: {EngineFamily: [POSTGRESQL, MYSQL, SQLSERVER]}
      result_id: DBProxy.DBProxyArn
      expect: {label: DBProxyName}
      note: "Pool connections in front of a DB. Auth as JSON [{\"AuthScheme\": \"SECRETS\", \"SecretArn\": \"arn:aws:secretsmanager:...\"}]; RoleArn may read that secret; at least two subnets in different AZs."
    - id: register-db-proxy-targets
      api: RegisterDBProxyTargets
      gesture: connect
      title: "Gắn DB vào proxy"
      fields: [{name: DBProxyName, ref: db-proxy, ref_by: label}, DBInstanceIdentifiers, DBClusterIdentifiers]
      source: db-proxy
      source_param: DBProxyName
      targets: [db-instance, db-cluster]
      note: "Send the proxy's connections to a DB instance or Aurora cluster (names, comma-separated)."

- kind: rds-event-subscription
  service: rds
  label: RDS Event Subscription
  list: {method: describe_event_subscriptions, items: EventSubscriptionsList}
  id: EventSubscriptionArn
  name: [CustSubscriptionId]
  parent: [{kind: region}]
  props:
    snsTopic: SnsTopicArn
    sourceType: SourceType
    sourceIds: "SourceIdsList && sort(SourceIdsList)"
    categories: "EventCategoriesList && sort(EventCategoriesList)"
    enabled: Enabled
    status: Status
  chat_props: [snsTopic, sourceType, sourceIds, categories, enabled, status]
  edges:
    # Sources are named by identifier; an empty list means every source of the type.
    - {kind: watches, target: "SourceType == 'db-instance' && SourceIdsList", match: DBInstanceIdentifier, to: db-instance, style: reference}
    - {kind: watches, target: "SourceType == 'db-cluster' && SourceIdsList", match: DBClusterIdentifier, to: db-cluster, style: reference}
    - {kind: notifies, target: SnsTopicArn, to: sns-topic, style: reference}
  caveats:
    - {code: rds-event-categories-dropped, prop: categories, text: "Floci 2.3.0 drops EventCategories on create and modify: the subscription lists none, as if it took every category."}
    - {code: rds-event-source-ids-dropped, prop: sourceIds, text: "Floci 2.3.0 drops SourceIds given on create; add-source-identifier-to-subscription keeps them. It accepts any SNS topic ARN, even one that does not exist."}
  floci: {status: control-plane-only, note: "Floci 2.3.0 stores event subscriptions but publishes no RDS events to their SNS topic (a reboot sends nothing)."}
  builder: true
  view: {role: block, category: database, icon: Res_Amazon-Simple-Notification-Service_Email-Notification_48.svg, source: Resource-Icons_07312026/Res_Application-Integration/Res_Amazon-Simple-Notification-Service_Email-Notification_48.svg, height: 0.3, order: 680, actions: [EventSubscription, EventSubscriptions]}
  contract:
    needs:
      - {op: create-topic, params: {Name: ct-rds-events}, save: topic}
    create: {op: create-event-subscription, params: {SubscriptionName: ct-rds-events, SnsTopicArn: "{topic}", SourceType: db-instance}, save: sub}
    then:
      - {op: modify-event-subscription, params: {SubscriptionName: ct-rds-events, Enabled: "false"}}
      - {op: delete-event-subscription, params: {SubscriptionName: ct-rds-events}}
  ops:
    - id: create-event-subscription
      api: CreateEventSubscription
      gesture: create
      title: "Tạo RDS event subscription"
      fields: [SubscriptionName, SnsTopicArn, SourceType, SourceIds, EventCategories, Enabled]
      choices: {SourceType: [db-instance, db-cluster, db-parameter-group, db-security-group, db-snapshot, db-cluster-snapshot, db-proxy]}
      defaults: {SourceType: db-instance}
      result_id: EventSubscription.EventSubscriptionArn
      expect: {label: SubscriptionName}
      note: "Send RDS events (failover, backup, low storage...) of SourceType to an SNS topic. SourceIds (identifiers, comma-separated) narrow it to some sources; EventCategories (availability, backup, failover...) to some kinds of event. The topic's policy must let rds.amazonaws.com publish."
    - id: modify-event-subscription
      api: ModifyEventSubscription
      gesture: attribute
      title: "Sửa RDS event subscription"
      fields: [{name: SubscriptionName, ref: rds-event-subscription, ref_by: label}, Enabled, SnsTopicArn, SourceType, EventCategories]
      targets: [rds-event-subscription]
      target_param: SubscriptionName
      note: "Turn the subscription on or off, or change its topic, source type or categories. Add sources with add-source-identifier-to-subscription."
    - id: add-source-identifier-to-subscription
      api: AddSourceIdentifierToSubscription
      gesture: attribute
      title: "Thêm nguồn cho event subscription"
      fields: [{name: SubscriptionName, ref: rds-event-subscription, ref_by: label}, SourceIdentifier]
      targets: [rds-event-subscription]
      target_param: SubscriptionName
      note: "Add one DB instance or cluster (its identifier) whose events the subscription sends."
    - id: delete-event-subscription
      api: DeleteEventSubscription
      gesture: delete
      title: "Xoá RDS event subscription"
      fields: [{name: SubscriptionName, ref: rds-event-subscription, ref_by: label}]
      targets: [rds-event-subscription]
      target_param: SubscriptionName
      note: "Delete the subscription; the SNS topic stays."
