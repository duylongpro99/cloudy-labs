# AWS Certificate Manager. Only certificate metadata is read (DescribeCertificate); GetCertificate and
# ExportCertificate are never called, so no certificate body, chain or private key reaches the graph.

- kind: acm-certificate
  service: acm
  label: ACM Certificate
  # ListCertificates answers RSA_1024 and RSA_2048 certificates only unless asked for the other key types.
  list: {method: list_certificates, items: CertificateSummaryList, params: {Includes: {keyTypes: [RSA_1024, RSA_2048, RSA_3072, RSA_4096, EC_prime256v1, EC_secp384r1, EC_secp521r1]}}}
  enrich:
    - {method: describe_certificate, params: {CertificateArn: CertificateArn}, pick: Certificate, merge_as: _Cert}
    - {method: list_tags_for_certificate, params: {CertificateArn: CertificateArn}, pick: Tags, merge_as: _Tags}
  id: CertificateArn
  name: [DomainName, CertificateArn]
  parent: [{kind: region}]
  props:
    domainName: DomainName
    status: Status
    type: Type
    subjectAlternativeNames: _Cert.SubjectAlternativeNames
    keyAlgorithm: _Cert.KeyAlgorithm
    validationMethod: "_Cert.DomainValidationOptions[0].ValidationMethod"
    issuer: _Cert.Issuer
    renewalEligibility: _Cert.RenewalEligibility
    transparencyLogging: _Cert.Options.CertificateTransparencyLoggingPreference
    inUseBy: _Cert.InUseBy
    tags: {hook: common.tags, args: {field: _Tags}}
  chat_props: [domainName, status, type, subjectAlternativeNames, keyAlgorithm, validationMethod, issuer, renewalEligibility, transparencyLogging, inUseBy]
  edges:
    - {kind: uses-certificate, target: CertificateArn, to: listener, match: "Certificates[].CertificateArn", reverse: true, style: reference}
  caveats:
    - {code: acm-issued-at-once, prop: status, text: "Floci 2.3.0 issues a requested certificate at once (Status ISSUED, validation SUCCESS, issuer CN=Floci Local CA) without DNS or email validation, and InUseBy lists only CloudFront distributions of Cognito domains, not the load balancer listeners that use it. Check the listener's certificate instead."}
  builder: true
  view: {role: block, category: security, icon: Arch_AWS-Certificate-Manager_48.svg, source: Architecture-Service-Icons_07312026/Arch_Security-Identity/48/Arch_AWS-Certificate-Manager_48.svg, height: 0.4, order: 515, actions: [Certificate, CertificateOptions]}
  contract:
    create: {op: request-certificate, params: {DomainName: ct-cert.example.com, ValidationMethod: DNS}, save: cert}
    then:
      - {op: update-certificate-options, params: {CertificateArn: "{cert}", Options.CertificateTransparencyLoggingPreference: DISABLED}}
      - {op: delete-certificate, params: {CertificateArn: "{cert}"}}
  ops:
    - id: request-certificate
      api: RequestCertificate
      gesture: create
      title: "Yêu cầu ACM Certificate"
      fields: [DomainName, ValidationMethod, SubjectAlternativeNames, KeyAlgorithm]
      choices: {ValidationMethod: [DNS, EMAIL], KeyAlgorithm: [RSA_2048, EC_prime256v1, EC_secp384r1]}
      defaults: {ValidationMethod: DNS}
      result_id: CertificateArn
      expect: {label: DomainName}
      note: "Request a public certificate for DomainName (and SubjectAlternativeNames, comma-separated). With DNS validation, create the CNAME record ACM gives in the domain's hosted zone; once ISSUED, attach it to an HTTPS listener or a CloudFront distribution (CloudFront takes certificates from us-east-1 only)."
    - id: update-certificate-options
      api: UpdateCertificateOptions
      gesture: attribute
      title: "Đổi tuỳ chọn Certificate"
      fields: [{name: CertificateArn, ref: acm-certificate}, Options.CertificateTransparencyLoggingPreference]
      choices: {Options.CertificateTransparencyLoggingPreference: [ENABLED, DISABLED]}
      target_param: CertificateArn
      note: "Turn certificate transparency logging on or off for the certificate."
    - id: delete-certificate
      api: DeleteCertificate
      gesture: delete
      title: "Xoá ACM Certificate"
      fields: [{name: CertificateArn, ref: acm-certificate}]
      targets: [acm-certificate]
      target_param: CertificateArn
      note: "Delete the certificate. A certificate still in use by a load balancer listener or a distribution cannot be deleted; remove it from them first."
