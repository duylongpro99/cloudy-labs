  filter: {path: State, not_in: [deleted, deleting]}
  enrich:
    - {method: search_transit_gateway_routes, params: {TransitGatewayRouteTableId: TransitGatewayRouteTableId}, const: {Filters: [{Name: state, Values: [active, blackhole]}]}, pick: Routes, merge_as: _Routes}
