# Test fixture for the M3 builder, modelled on the Lab 6 steps of spikes/m0-emulators/lab-06-07.sh.
# Not lab content: the real Lab 6 replaces it once it is written.
id: fixture-lab-06
provider: aws
emulator: floci
title: Fixture Lab 6 (VPC from scratch)
cidrs: [10.66.0.0/16]
builder:
  palette: [vpc, subnet, igw, elastic-ip, nat, route-table]
  tags: {lab: fixture-lab-06}
tasks:
  - id: vpc
    text: Create a VPC 10.66.0.0/16 and turn on DNS hostnames.
  - id: subnets
    text: Create two public and two private subnets across two Availability Zones; public subnets give instances a public IP.
  - id: internet-gateway
    text: Create an Internet Gateway and attach it to the VPC.
  - id: nat-gateway
    text: Allocate an Elastic IP and create a NAT Gateway with it in a public subnet.
  - id: routing
    text: Route the public subnets to the Internet Gateway and the private subnets to the NAT Gateway.
checks:
  - id: vpc-exists
    task: vpc
    fn: checks:vpc_exists
    args: {cidr: 10.66.0.0/16}
    description: The tagged VPC exists with the expected CIDR.
  - id: vpc-dns-hostnames
    task: vpc
    fn: checks:vpc_dns_hostnames
    description: The VPC has DNS hostnames enabled.
  - id: subnets-two-azs
    task: subnets
    fn: checks:subnets_two_azs
    description: Two public and two private subnets, each pair across two AZs.
  - id: public-ip-on-launch
    task: subnets
    fn: checks:public_ip_on_launch
    description: Public subnets map a public IP on launch.
  - id: igw-attached
    task: internet-gateway
    fn: checks:igw_attached
    description: An Internet Gateway is attached to the VPC.
  - id: nat-in-public-subnet
    task: nat-gateway
    fn: checks:nat_in_public_subnet
    description: A NAT Gateway with an Elastic IP sits in a public subnet.
  - id: public-route-table
    task: routing
    fn: checks:public_route_table
    description: A route table sends 0.0.0.0/0 to the Internet Gateway and serves both public subnets.
  - id: private-route-table
    task: routing
    fn: checks:private_route_table
    description: A route table sends 0.0.0.0/0 to the NAT Gateway and serves both private subnets.
hints:
  - task: subnets
    text: A subnet is public when its route table sends 0.0.0.0/0 to an Internet Gateway.
target:
  nodes:
    - {id: vpc, kind: vpc, label: VPC 10.66.0.0/16, checks: [vpc-exists, vpc-dns-hostnames]}
    - {id: igw, kind: igw, parent: vpc, label: Internet Gateway, checks: [igw-attached]}
    - {id: az-1, kind: az, parent: vpc, label: AZ thứ nhất}
    - {id: az-2, kind: az, parent: vpc, label: AZ thứ hai}
    # The NAT comes before the subnets: a node is held to its parent only when the parent bound
    # first, so declared here the NAT binds in whichever public subnet the learner chose.
    - {id: nat, kind: nat, parent: public-1, label: NAT Gateway, checks: [nat-in-public-subnet]}
    - {id: public-1, kind: subnet-public, parent: az-1, label: Public 1, checks: [subnets-two-azs, public-ip-on-launch]}
    - {id: public-2, kind: subnet-public, parent: az-2, label: Public 2, checks: [subnets-two-azs, public-ip-on-launch]}
    - {id: private-1, kind: subnet-private, parent: az-1, label: Private 1, checks: [subnets-two-azs]}
    - {id: private-2, kind: subnet-private, parent: az-2, label: Private 2, checks: [subnets-two-azs]}
    - {id: eip, kind: elastic-ip, label: Elastic IP của NAT, checks: [nat-in-public-subnet]}
    - {id: rt-public, kind: route-table, parent: vpc, label: Route table public, checks: [public-route-table]}
    - {id: rt-private, kind: route-table, parent: vpc, label: Route table private, checks: [private-route-table]}
